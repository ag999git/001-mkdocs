site_name: Python 999
site_url: https://ag999git.github.io/001-mkdocs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections      # Organize chapters into distinct, readable sections
    - navigation.expand        # Keep chapter sub-items expanded by default
    - navigation.top           # Add a floating "Back to top" button
    - navigation.indexes       # Treat folder index files as section landing pages
    - content.code.copy        # Add a one-click copy button to all code blocks
    - toc.integrate            # Merge page section headings into the right sidebar

docs_dir: docs

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
